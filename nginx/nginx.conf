worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 上传体积（3D 曲面数据可能较大）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── upstream ──
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream api {
        server api:8080;
        keepalive 32;
    }

    # ── HTTP -> HTTPS 重定向 ──
    server {
        listen 80;
        listen [::]:80;
        server_name volsurf.yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name volsurf.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/volsurf.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/volsurf.yourdomain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 公开 API
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 内部接口：仅允许内网访问
        location /api/internal/ {
            allow 172.16.0.0/12;   # Docker 内网
            allow 10.0.0.0/8;       # 私有网络
            allow 192.168.0.0/16;   # 局域网
            deny all;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        }

        # 前端
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}